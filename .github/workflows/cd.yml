name: CD

on:
  push:
    tags:
      - "v*.*.*"
  # Build the release for an existing tag again, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.1"
        required: true

# Creating the GitHub release needs write access; the default token is read-only.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TERM: xterm

jobs:
  publish:
    name: Publishing ${{ matrix.build_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          - build_target: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ''
            dependencies: 'pkg-config libssl-dev libpulse-dev'
          - build_target: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ''
            dependencies: 'pkg-config libssl-dev libpulse-dev'
          - build_target: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            features: '--no-default-features --features rodio_backend'
          - build_target: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
            features: '--no-default-features --features rodio_backend'
          - build_target: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: '--no-default-features --features rodio_backend,share_clipboard,notify'
    steps:
      - uses: actions/checkout@v7
        name: Checkout src
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install rustup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install portaudio pkg-config
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.dependencies }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Running cargo build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Extract git tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
        id: extract_tag
      - name: Packaging assets
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          case ${{ matrix.target }} in
          *-pc-windows-*)
            7z -y a ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.zip ttunes.exe
            sha256sum ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.zip > ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.sha256
            ;;
          *)
            tar czvf ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.tar.gz ttunes
            shasum -a 256 ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.tar.gz > ttunes-${{ steps.extract_tag.outputs.tag }}-${{ matrix.build_target }}.sha256
            ;;
          esac;
      - name: Releasing assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract_tag.outputs.tag }}
          files: target/${{ matrix.target }}/release/ttunes-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
