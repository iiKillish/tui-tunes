name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Nothing here writes to the repository; pull requests run their own build scripts.
permissions:
  contents: read

env:
  TERM: xterm
  # Nobody debugs CI builds; without debug info they link faster and cache smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Build the Rust code.
  build:
    name: Checking ${{ matrix.build_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build_target: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ''
          - build_target: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ''
          - build_target: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            features: ''
          - build_target: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: '--no-default-features --features rodio_backend,share_clipboard,notify'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --target ${{ matrix.target }} -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt
      # Caches dependencies by Rust version, falling back to the newest cache when Cargo.lock
      # changes. Only main saves, so pull requests don't push main's cache out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install portaudio pkg-config
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libpulse-dev
      - name: Running cargo build
        run: cargo build --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Running cargo test
        run: cargo test --locked --target ${{ matrix.target }} ${{ matrix.features }}

  # Build with the oldest Rust in rust-version: cargo install builds with the user's Rust, which
  # rust-toolchain.toml doesn't choose.
  msrv:
    name: Building with the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libpulse-dev
      - name: Install the rust-version toolchain
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The cache's own key has rust-toolchain.toml's Rust, not this one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The version comes from a pull request's Cargo.toml, so it goes in as a variable rather
      # than being pasted into the script.
      - name: cargo check with rust-version
        run: cargo +"$MSRV" check --locked --all-targets
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

  # Check Rust code formatting.
  fmt:
    name: Running `cargo fmt`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install clippy + rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  # Run `cargo clippy` on all the targets in all workspace members with all
  # features enabled, and return an error if there are any clippy suggestions.
  clippy:
    name: Running `cargo clippy`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install clippy + rustfmt
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libpulse-dev libasound2-dev portaudio19-dev
      - name: cargo clippy
        run: cargo clippy --locked --no-deps --workspace --all-targets --all-features --verbose -- -D warnings

  # Fail when a crate in Cargo.lock has a security advisory against it. Which advisories count
  # is set in deny.toml.
  advisories:
    name: Checking dependencies for security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
