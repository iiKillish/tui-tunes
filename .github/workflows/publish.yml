name: Publish

# Publishes to crates.io when a version tag (v1.2.3) is pushed, using crates.io trusted publishing:
# crates.io trusts this repository and workflow, so no API token is stored in GitHub. Set it up
# once under the crate's Settings → Trusted Publishing on crates.io (repository
# iiKillish/tui-tunes, workflow publish.yml).
#
# The job runs in the crates-io environment, so publishing can be made to wait for approval:
# GitHub creates the environment on the first run; add required reviewers to it under the
# repository's Settings → Environments. Entering crates-io as the environment in the crates.io
# trusted publishing settings as well makes crates.io refuse tokens to any other job.

on:
  push:
    tags:
      - "v*.*.*"

# Nothing outside the publish job gets any access.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # lets the job prove to crates.io which repository and workflow it is
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libpulse-dev
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
