[package]
name = "ttunes"
readme = "README.md"
version = "0.9.0"
description = "Spotify player for the terminal, written in Rust using librespot and ratatui"
keywords = ["spotify", "music", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
# The oldest Rust that builds ttunes; CI checks it. cargo install uses the user's own Rust, not
# rust-toolchain.toml, so newer language features break installs.
rust-version = "1.93"
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "doc/**",
    "misc/ttunes.desktop",
]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[workspace]
members = [
    ".",
    "xtask"
]

[workspace.package]
authors = ["iiKillish"]
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/iiKillish/tui-tunes"

[workspace.lints.clippy]
enum_glob_use = "warn"
use_self = "deny"
multiple_inherent_impl = "deny"

[lints]
workspace = true

# Backtraces keep file and line numbers; full debug info only slows linking.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.optimized]
inherits = "release"
lto = false
codegen-units = 16

[dependencies]
chrono = "0.4"
clap = "4.6.1"
arboard = {version = "3.6", optional = true}
crossbeam-channel = "0.5"
zbus = {version = "5.16.0", default-features = false, features = ["tokio"], optional = true}
fern = "0.7"
futures = "0.3"
icy_sixel = {version = "0.7", optional = true}
image = {version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true}
libc = "0.2.186"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-protocol = "0.8.0"
librespot-playback = {version = "0.8.0", default-features = false, features = ["native-tls"]}
log = "0.4.32"
platform-dirs = "0.3.0"
rand = "0.10"
rodio = {version = "0.21", default-features = false, features = ["playback"], optional = true}
# native-tls like the other dependencies: reqwest's default, rustls, builds aws-lc-rs (C code,
# slow to compile) just for this.
reqwest = {version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "socks", "system-proxy"]}
serde = "1.0"
serde_cbor = "0.11.2"
serde_json = "1.0"
# Reads music files' tags for the Local tab, as librespot does to play them.
symphonia = {version = "0.5", default-features = false, features = ["mp3", "flac"]}
strum = "0.28"
strum_macros = "0.28"
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "net"]}
tokio-util = {version = "0.7.18", features = ["codec"]}
tokio-stream = {version = "0.1.18", features = ["sync"]}
toml = "1.1"
toml_edit = "0.25"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
url = "2.5"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

# Each system's sound, so a plain install works everywhere: PulseAudio on Linux and the BSDs (PipeWire
# provides it too)...
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
librespot-playback = {version = "0.8.0", default-features = false, features = ["native-tls", "pulseaudio-backend"]}
# For ttunes' own PulseAudio sink (src/audio/pulseaudio.rs).
libpulse-binding = {version = "2", default-features = false}
libpulse-simple-binding = {version = "2", default-features = false}

# ...and Rodio (CoreAudio on macOS, WASAPI on Windows) elsewhere, with ttunes' own sink
# (src/audio/rodio_sink.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
librespot-playback = {version = "0.8.0", default-features = false, features = ["native-tls", "rodio-backend"]}
rodio = {version = "0.21", default-features = false, features = ["playback"]}

[dependencies.rspotify]
default-features = false
features = ["client-ureq", "ureq-native-tls"]
version = "0.16.1"

[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

[dependencies.notify-rust]
default-features = false
version = "4"
# Use zbus, which we already depend on, instead of dbus.
features = ["z"]
optional = true

# Not used by ttunes' build script. It keeps librespot-core's build script, through vergen-gitcl
# 1.0, on vergen 9.0: vergen 9.1 moved to vergen-lib 9 while vergen-gitcl 1.0 still uses
# vergen-lib 0.1, so with vergen 9.1 the build script fails to compile. Matters for installs
# without --locked, which pick the newest versions.
[build-dependencies]
vergen = {version = "=9.0.6", default-features = false}

[features]
alsa_backend = ["librespot-playback/alsa-backend"]
cover = ["image", "icy_sixel"] # Show album covers (Kitty, sixel or iTerm2 images)
default = ["cover", "share_clipboard", "mpris", "notify"]
mpris = ["zbus"] # Allow ttunes to be controlled via MPRIS API
notify = ["notify-rust"] # Show what's playing via a notification
portaudio_backend = ["librespot-playback/portaudio-backend"]
pulseaudio_backend = [] # Kept for older build commands: Linux and BSD builds have PulseAudio anyway
rodio_backend = ["librespot-playback/rodio-backend", "dep:rodio"]
share_clipboard = ["arboard", "arboard/wayland-data-control"] # Share a link to the system clipboard
share_selection = ["arboard", "arboard/wayland-data-control"] # Use the primary selection for sharing - linux and bsd only
