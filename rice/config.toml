# Colors come from the theme project (kde/theme/palette.json), which generates theme.toml.
theme_file = "theme.toml"
# Own Spotify app (an option this fork adds). Redirect URI: http://127.0.0.1:8989/login
client_id = "your-client-id"

# Icons for the player bar; Ghostty has Nerd Font symbols built in.
use_nerdfont = true

# Playlists first; Tracks (saved songs) last.
library_tabs = ["playlists", "albums", "artists", "tracks", "podcasts", "browse"]

[keybindings]
# Space pauses (like most players); "add to queue", its default, moves to e (enqueue).
"Space" = "playpause"
"e" = "queue"
